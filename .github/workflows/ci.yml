name: CI

on:
  pull_request:
    branches: [main]
  push:
    # Validate the fork integration branch before tag-driven release builds.
    branches: [main, test/codex-chatgpt-auth-route, feat/magpie-inspired]
  # 每周一次全量：push 到 main 也按路径过滤后，靠它在缓存被淘汰后重新建起来
  schedule:
    - cron: "41 19 * * 0" # 周一 03:41（北京时间）
  workflow_dispatch:

concurrency:
  # PR 和 fork 集成分支只跑最新提交；main 每次运行独立，保留上游的逐提交验证。
  # main（push / 定时 / 手动）：每次运行单独一组、从不取消，发版要求 main 上每个提交都完整跑过。
  # 不能让它们共用一个组再关掉 cancel：一个组只留一个排队中的运行，连推时中间的提交照样会被挤掉。
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'push' && github.ref == 'refs/heads/feat/magpie-inspired' && github.ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/feat/magpie-inspired') }}

env:
  # 测试失败时有文件名和行号就够了。完整调试信息让链接变慢（Windows 尤甚）、target 和缓存变大。
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      # 定时 / 手动运行不过滤（过滤步骤被跳过、输出为空），一律当作两边都有改动
      frontend: ${{ steps.filter.outputs.frontend || 'true' }}
      backend: ${{ steps.filter.outputs.backend || 'true' }}
    steps:
      # On pull_request the filter reads changed files via the API (no checkout);
      # on push it needs a local git history to diff against.
      - name: Checkout
        if: github.event_name == 'push'
        uses: actions/checkout@v6

      - name: Detect changed paths
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            frontend:
              - "src/**"
              - "tests/**"
              - "scripts/**"
              - "index.html"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig.json"
              - "tsconfig.node.json"
              - "vite.config.ts"
              - "vitest.config.ts"
              - "tailwind.config.cjs"
              - "postcss.config.cjs"
              - "components.json"
              - "README*.md"
              - ".github/workflows/**"
            backend:
              - "src-tauri/**"
              - "scripts/**"
              - "rust-toolchain.toml"
              - ".github/workflows/**"

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    needs: changes
    # PR 和 push 到 main 都按路径过滤。缓存 key 精确命中时不会重存，main 全量跑并不能
    # 预热什么；缓存被淘汰后由每周的定时全量重建。
    if: needs.changes.outputs.frontend == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 版本取 package.json 的 packageManager。先装 pnpm，setup-node 才能按 pnpm-lock 缓存 store。
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript type check
        shell: bash
        run: pnpm typecheck 2>&1 | tee "$RUNNER_TEMP/frontend-types.log"

      - name: Check formatting
        shell: bash
        run: pnpm format:check 2>&1 | tee "$RUNNER_TEMP/frontend-format.log"

      - name: Build frontend
        shell: bash
        run: pnpm build:renderer 2>&1 | tee "$RUNNER_TEMP/frontend-build.log"

      - name: Report frontend failure diagnostics
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          for path in sorted(pathlib.Path(os.environ["RUNNER_TEMP"]).glob("frontend-*.log")):
              text = path.read_text(encoding="utf-8", errors="replace")
              text = re.sub(r"\x1b\[[0-9;]*m", "", text)
              tail = "\n".join(text.splitlines()[-120:])[-12000:]
              escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title={path.stem}::{escaped}")
          PY

      # Produce reviewable formatting patches in the cloud as well. This allows
      # source-only local checkouts to fix formatting without installing Node deps.
      - name: Report frontend formatting patches
        if: failure()
        shell: bash
        run: |
          pnpm format > "$RUNNER_TEMP/frontend-format-fixes.log" 2>&1
          python - <<'PY'
          import base64
          import gzip
          import subprocess

          paths = subprocess.check_output(["git", "diff", "--name-only", "--", "src/"]).decode().splitlines()
          for path in paths:
              patch = subprocess.check_output(["git", "diff", "--", path])
              encoded = base64.b64encode(gzip.compress(patch)).decode()
              if len(encoded) <= 55000:
                  print(f"::error title=prettier-patch::{path} PATCH_GZIP_BASE64:{encoded}")
          PY

  codex-config-contract:
    name: Official Codex configuration contract (0.162.1)
    # 22.04 allows the official CLI's user-namespace sandbox probe. Newer
    # hosted images restrict that probe independently of configuration validity.
    runs-on: ubuntu-22.04
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install Codex sandbox prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap

      - name: Setup pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          corepack install

      - name: Install fixture export dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned official CLI
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-contract-cli" --no-audit --no-fund @openai/codex@0.162.1
          "$RUNNER_TEMP/codex-contract-cli/node_modules/.bin/codex" --version

      - name: Export actual application configurations
        shell: bash
        run: |
          CODEX_CONFIG_FIXTURES_DIR="$RUNNER_TEMP/codex-contract/fixtures" \
            pnpm exec vitest run tests/contracts/codexConfigFixtures.test.ts

      - name: Generate official app-server protocol schema
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/codex-contract/schema-home"
          CODEX_HOME="$RUNNER_TEMP/codex-contract/schema-home" \
            "$RUNNER_TEMP/codex-contract-cli/node_modules/.bin/codex" \
            app-server generate-json-schema --out "$RUNNER_TEMP/codex-contract/protocol-schema"

      - name: Strict-load fixtures with official config/read
        shell: bash
        run: |
          python scripts/validate-codex-config.py \
            --codex "$RUNNER_TEMP/codex-contract-cli/node_modules/.bin/codex" \
            --fixtures "$RUNNER_TEMP/codex-contract/fixtures" \
            --report "$RUNNER_TEMP/codex-contract/report.json" \
            2>&1 | tee "$RUNNER_TEMP/codex-contract-validation.log"

      - name: Publish contract result
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib

          report = pathlib.Path(os.environ["RUNNER_TEMP"]) / "codex-contract/report.json"
          if report.exists():
              data = json.loads(report.read_text())
              failures = [row for row in data["fixtures"] if row["status"] != "passed"]
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(f"Official Codex {data['version']}: {len(data['fixtures']) - len(failures)}/{len(data['fixtures'])} configurations loaded; {data['negativeControls']} unknown-field controls rejected.\n")
              for row in failures:
                  message = f"{row['name']}: {row['error']}".replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print(f"::error title=Codex config contract::{message}")
          PY

      - name: Upload configuration contract evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codex-config-contract-0.162.1
          path: |
            ${{ runner.temp }}/codex-contract/report.json
            ${{ runner.temp }}/codex-contract/fixtures/
            ${{ runner.temp }}/codex-contract/protocol-schema/
            ${{ runner.temp }}/codex-contract-validation.log
          if-no-files-found: warn
          retention-days: 7

  # 单元测试是前端最慢的一段：4 核上约 5 分钟，几乎全是每个文件起 jsdom、跑 setup 的 CPU。
  # 按文件分到四台机器上跑。
  frontend-tests:
    name: Frontend Tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 版本取 package.json 的 packageManager。先装 pnpm，setup-node 才能按 pnpm-lock 缓存 store。
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        shell: bash
        run: pnpm test:unit --shard=${{ matrix.shard }}/4 2>&1 | tee "$RUNNER_TEMP/frontend-tests.log"

      - name: Report test failure diagnostics
        if: failure()
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "frontend-tests.log"
          if path.exists():
              text = re.sub(r"\x1b\[[0-9;]*m", "", path.read_text(encoding="utf-8", errors="replace"))
              tail = "\n".join(text.splitlines()[-120:])[-12000:]
              escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=frontend-tests::{escaped}")
          PY

  backend:
    name: Backend Checks
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # The ARM pool repeatedly failed to acquire a runner. Keep macOS checks
        # on the supported Intel image while release builds cover both targets.
        os: [ubuntu-22.04, windows-latest, macos-15-intel]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # rust-toolchain.toml 是编译器版本的唯一来源：直接装它，免得先装 stable 再被 rustup 换掉
      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: ${{ runner.os == 'Linux' && 'rustfmt, clippy' || 'clippy' }}

      # 格式和系统无关，只在 Linux 上查一次；放在装依赖、恢复缓存之前，格式不对几秒就报错
      - name: Check Rust formatting
        if: runner.os == 'Linux'
        shell: bash
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml 2>&1 | tee "$RUNNER_TEMP/backend-format.log"

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev \
            libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev \
            || sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.0-dev
          sudo apt-get install -y --no-install-recommends libsoup-3.0-dev \
            || sudo apt-get install -y --no-install-recommends libsoup2.4-dev

      # 只缓存依赖：本仓库的 crate 每次都要重编，缓存它只会让缓存变大、恢复变慢。
      # key 自带 OS、rustc 版本和 Cargo.lock；shared-key 让 WSL2 job 能读到 Windows 这份。
      # main 和 fork 集成分支保存缓存；PR 只恢复，避免占用其它分支用不到的缓存配额。
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: backend
          save-if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feat/magpie-inspired' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@e407f7bafb71fd004bc5c2da3032e5470cbb6ef0 # v2.87.24
        with:
          tool: cargo-nextest

      - name: Create frontend dist placeholder
        shell: bash
        run: mkdir -p dist

      - name: Clippy
        shell: bash
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings 2>&1 | tee "$RUNNER_TEMP/backend-clippy.log"

      # 每个测试一个进程，单测超时见 src-tauri/.config/nextest.toml。doctest 目前只有两个
      # ignored，nextest 不跑 doctest 也不漏。
      - name: Run tests
        shell: bash
        run: cargo nextest run --manifest-path src-tauri/Cargo.toml --profile ci 2>&1 | tee "$RUNNER_TEMP/backend-tests.log"

      # Expose actionable diagnostics in the public checks API as well. Downloading
      # full Actions logs requires repository access, even for this public fork.
      - name: Report backend failure diagnostics
        if: failure()
        shell: bash
        env:
          # Windows Python defaults to cp1252; Rust diagnostics contain Chinese
          # and Unicode symbols that must reach the Actions annotation intact.
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          for path in sorted(pathlib.Path(os.environ["RUNNER_TEMP"]).glob("backend-*.log")):
              text = path.read_text(encoding="utf-8", errors="replace")
              text = re.sub(r"\x1b\[[0-9;]*m", "", text)
              lines = [line for line in text.splitlines() if not re.match(r"\s*(?:PASS|SKIP)\s+\[", line)]
              tail = "\n".join(lines[-100:])[-3500:]
              escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title={path.stem}::{escaped}")
          PY

  backend-windows-wsl2:
    name: Backend Checks (Windows + WSL2 home)
    runs-on: windows-2025
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}

      - name: Setup WSL2
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7
        with:
          distribution: Ubuntu-24.04
          wsl-version: 2
          additional-packages: python3

      # 只恢复不保存：这里只编 lib 测试，若由它先存，同 key 的 Windows 缓存就只剩一小半。
      # 完整缓存由 backend 矩阵的 Windows job 保存（同一个 shared-key）。
      - name: Restore Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: backend
          save-if: false

      - name: Create frontend dist placeholder
        shell: bash
        run: mkdir -p dist

      - name: Prepare WSL2-backed test environment
        shell: pwsh
        run: |
          wsl.exe -d Ubuntu-24.04 -- bash -lc "rm -rf /tmp/cc-switch-windows-test-root && mkdir -p /tmp/cc-switch-windows-test-root/{home,temp} && chmod -R 0777 /tmp/cc-switch-windows-test-root"
          $testRoot = "\\wsl.localhost\Ubuntu-24.04\tmp\cc-switch-windows-test-root"
          $testHome = Join-Path $testRoot "home"
          $testTemp = Join-Path $testRoot "temp"
          foreach ($path in @($testRoot, $testHome, $testTemp)) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "WSL2-backed test path is unavailable: $path"
            }
          }
          "CC_SWITCH_TEST_HOME=$testHome" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_SWITCH_WSL_TEST_DIR=$testRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_SWITCH_WSL_TEST_TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile backend tests with native temp
        # link.exe/mt.exe cannot create manifests when TEMP points at a WSL UNC path.
        # Record the built test binary path so the run step below can execute
        # it directly instead of re-invoking cargo with TEMP on \\wsl.localhost.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        shell: pwsh
        run: |
          $testBinary = cargo test --lib --manifest-path src-tauri/Cargo.toml --no-run --message-format=json |
            ForEach-Object {
              if ($_ -match '"reason":"compiler-(artifact|message)"') {
                $artifact = $_ | ConvertFrom-Json
                if ($artifact.reason -eq 'compiler-message') {
                  # Keep diagnostics visible without mixing them into the executable path pipeline.
                  Write-Host $artifact.message.rendered
                } elseif ($artifact.executable -and $artifact.profile.test -and $artifact.target.name -eq 'cc_switch_lib') {
                  $artifact.executable
                }
              }
            } | Select-Object -First 1 -Wait
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          if (-not $testBinary) {
            throw "cc_switch_lib test binary not found in cargo compiler artifacts"
          }
          "CC_SWITCH_TEST_EXE=$testBinary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Windows-to-WSL2 filesystem contract
        # Run the test binary built in the previous step directly. Invoking cargo
        # here with TEMP pointing at a WSL UNC path can re-link the crate, and
        # link.exe/mt.exe cannot create manifest temp files on \\wsl.localhost.
        shell: pwsh
        run: |
          $env:TEMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $env:TMP = $env:CC_SWITCH_WSL_TEST_TEMP
          $testName = "config::tests::atomic_write_replaces_existing_wsl_unc_file"
          $testList = & $env:CC_SWITCH_TEST_EXE --list --ignored
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $expected = "${testName}: test"
          if ($testList -notcontains $expected) {
            throw "Expected ignored test was not discovered: $testName"
          }
          & $env:CC_SWITCH_TEST_EXE $testName --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Run Hermes live WAL reads inside WSL2
        env:
          CC_SWITCH_WSL_DISTRO: Ubuntu-24.04
        shell: pwsh
        run: |
          $testName = "session_manager::providers::hermes::tests::wsl2_live_wal_readonly_reference"
          $testList = & $env:CC_SWITCH_TEST_EXE --list --ignored
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($testList -notcontains "${testName}: test") { throw "Hermes WSL test not discovered" }
          & $env:CC_SWITCH_TEST_EXE $testName --ignored --exact --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
